<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Issue Finder</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#1a7f37;--accent-text:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b23;--text:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#2ea043}}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--text);line-height:1.5}
main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:2.2rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
select,input,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
input{flex:1;min-width:160px}
button{background:var(--accent);color:var(--accent-text);border-color:var(--accent);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.issue{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.issue a.title{color:var(--text);font-weight:bold;font-size:1.1rem;text-decoration:none}
.issue a.title:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:.9rem;margin-top:6px}
.msg{padding:16px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.err{color:#cf222e;border-color:#cf222e}
.status{font-size:.9rem;color:var(--muted);margin:-12px 0 20px}
.status b{color:var(--accent)}
.explain{margin-top:10px;background:transparent;color:var(--accent);border-color:var(--accent);padding:6px 12px;font-size:.9rem}
.health{margin-top:10px;margin-left:8px;background:transparent;color:var(--text);border-color:var(--line);padding:6px 12px;font-size:.9rem}
.hbox{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:6px;font-size:.95rem}
.score{font-size:1.2rem;font-weight:bold;margin-bottom:6px}
.ok{color:var(--accent)}.bad{color:#cf222e}
.verdict{margin-top:8px;font-style:italic}
.ai{margin-top:10px;padding:12px;border-left:3px solid var(--accent);background:var(--bg);white-space:pre-wrap;font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>First Issue Finder</h1>
  <p class="sub">Pick a language and see real beginner-friendly open source issues you can work on today.</p>

  <div class="controls">
    <select id="lang" aria-label="Programming language">
      <option>python</option><option>javascript</option><option>java</option>
      <option>typescript</option><option>c++</option><option>go</option>
      <option>rust</option><option>html</option><option>php</option>
    </select>
    <input id="kw" type="text" placeholder="Optional keyword (e.g. docs, bug)" aria-label="Keyword">
    <select id="sort" aria-label="Sort by">
      <option value="updated">Recently updated</option>
      <option value="created">Newest</option>
      <option value="comments">Most discussed</option>
    </select>
    <button id="go">Find issues</button>
  </div>

  <div class="status" id="status">Checking for Ollama...</div>

  <div id="out"><div class="msg">Choose a language and press "Find issues".</div></div>
</main>

<script>
const out = document.getElementById("out");
const btn = document.getElementById("go");
const statusEl = document.getElementById("status");
const OLLAMA = "http://localhost:11434";
let model = null;
let items = [];

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function ago(d){
  const days = Math.floor((Date.now() - new Date(d)) / 86400000);
  return days <= 0 ? "today" : days + (days === 1 ? " day ago" : " days ago");
}

// Find the installed Gemma model automatically
async function detectModel(){
  try {
    const res = await fetch(OLLAMA + "/api/tags");
    const data = await res.json();
    const names = data.models.map(m => m.name);
    model = names.find(n => n.toLowerCase().includes("gemma")) || names[0] || null;
    statusEl.innerHTML = model
      ? "AI explanations: <b>ready</b> using " + esc(model)
      : "Ollama is running but no model is installed.";
  } catch (e) {
    statusEl.textContent = "AI explanations are off. Start Ollama with OLLAMA_ORIGINS=\"*\" (see README) to turn them on.";
  }
}

async function findIssues(){
  const lang = document.getElementById("lang").value;
  const kw = document.getElementById("kw").value.trim();
  const sort = document.getElementById("sort").value;
  let q = 'label:"good first issue" language:' + lang + ' state:open is:issue no:assignee';
  if (kw) q += " " + kw;
  const url = "https://api.github.com/search/issues?per_page=20&sort=" + sort +
              "&order=desc&q=" + encodeURIComponent(q);

  btn.disabled = true;
  out.innerHTML = '<div class="msg">Loading issues...</div>';
  try {
    const res = await fetch(url, {headers: {"Accept": "application/vnd.github+json"}});
    if (res.status === 403 || res.status === 429) throw new Error("GitHub rate limit reached. Wait one minute and try again.");
    if (!res.ok) throw new Error("GitHub returned an error (" + res.status + "). Try again.");
    const data = await res.json();
    items = data.items;
    if (!items.length) {
      out.innerHTML = '<div class="msg">No issues found. Try another language or remove the keyword.</div>';
      return;
    }
    out.innerHTML = items.map((i, n) => {
      const repo = i.repository_url.split("/repos/")[1];
      return '<div class="issue">' +
        '<a class="title" href="' + esc(i.html_url) + '" target="_blank" rel="noopener">' + esc(i.title) + '</a>' +
        '<div class="meta">' + esc(repo) + ' &middot; updated ' + ago(i.updated_at) + ' &middot; ' + i.comments + ' comments</div>' +
        '<button class="explain" data-n="' + n + '">Explain this issue</button>' +
        '<button class="health" data-n="' + n + '">Check repo health</button>' +
        '<div class="hbox" id="h-' + n + '" hidden></div>' +
        '<div class="ai" id="ai-' + n + '" hidden></div></div>';
    }).join("");
  } catch (e) {
    const msg = e.message.startsWith("GitHub") ? e.message : "Could not reach GitHub. Check your internet connection.";
    out.innerHTML = '<div class="msg err">' + esc(msg) + '</div>';
  } finally {
    btn.disabled = false;
  }
}

async function explain(n, button){
  const box = document.getElementById("ai-" + n);
  box.hidden = false;
  if (!model) { await detectModel(); }
  if (!model) {
    box.textContent = "Ollama was not found. Start it with OLLAMA_ORIGINS=\"*\" ollama serve, then try again.";
    return;
  }
  const i = items[n];
  const body = (i.body || "(no description)").slice(0, 1500);
  button.disabled = true;
  box.textContent = "Gemma is thinking... this can take a few seconds.";
  try {
    const res = await fetch(OLLAMA + "/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: model,
        stream: false,
        messages: [
          {role: "system", content: "You are a friendly mentor for first-time open source contributors. Use simple words. Reply in exactly this format:\nSummary: (2-3 sentences)\nDifficulty: (Easy, Medium or Hard, with one short reason)\nHow to start: (3 short numbered steps)"},
          {role: "user", content: "Issue title: " + i.title + "\n\nIssue description:\n" + body}
        ]
      })
    });
    if (!res.ok) throw new Error("Ollama error " + res.status);
    const data = await res.json();
    box.textContent = data.message.content.trim();
  } catch (e) {
    box.textContent = "Could not get an explanation. Make sure Ollama is running with OLLAMA_ORIGINS set, and use Chrome.";
  } finally {
    button.disabled = false;
  }
}

async function health(n, button){
  const box = document.getElementById("h-" + n);
  box.hidden = false;
  const repo = items[n].repository_url.split("/repos/")[1];
  button.disabled = true;
  box.textContent = "Checking " + repo + "...";
  try {
    const h = {"Accept": "application/vnd.github+json"};
    const base = "https://api.github.com/repos/" + repo;
    const rs = await Promise.all([
      fetch(base, {headers: h}),
      fetch(base + "/community/profile", {headers: h}),
      fetch(base + "/pulls?state=closed&per_page=20", {headers: h})
    ]);
    if (rs.some(r => r.status === 403 || r.status === 429)) throw new Error("rate");
    if (!rs[0].ok) throw new Error("fail");
    const info = await rs[0].json();
    const comm = rs[1].ok ? await rs[1].json() : {};
    const prs = rs[2].ok ? await rs[2].json() : [];
    const files = comm.files || {};

    const days = Math.floor((Date.now() - new Date(info.pushed_at)) / 86400000);
    const merged = prs.filter(p => p.merged_at).length;
    const rate = prs.length ? merged / prs.length : null;

    let score = 0;
    const checks = [];
    const add = (ok, pts, label) => { if (ok) score += pts; checks.push([ok, label]); };
    score += days <= 90 ? 3 : (days <= 365 ? 1 : 0);
    checks.push([days <= 90, "Last activity " + ago(info.pushed_at)]);
    add(!!files.contributing, 2, files.contributing ? "Has a contributing guide" : "No contributing guide");
    add(!!(info.license || files.license), 1, (info.license || files.license) ? "Has a license" : "No license");
    add(!!files.code_of_conduct, 1, files.code_of_conduct ? "Has a code of conduct" : "No code of conduct");
    if (rate === null) {
      checks.push([false, "No closed pull requests to judge"]);
    } else {
      score += rate >= 0.5 ? 3 : (rate >= 0.25 ? 1 : 0);
      checks.push([rate >= 0.5, merged + " of last " + prs.length + " closed pull requests were merged"]);
    }

    let verdict = score >= 8 ? "Active and welcoming project. A good place to start."
                : score >= 5 ? "Decent project, but check the issue comments before you start."
                : "Risky for a first contribution. It may be inactive or slow to review.";

    box.innerHTML = '<div class="score">Beginner-friendliness: ' + score + '/10</div>' +
      checks.map(c => '<div class="' + (c[0] ? "ok" : "bad") + '">' + (c[0] ? "&#10003; " : "&#10007; ") + esc(c[1]) + '</div>').join("") +
      '<div class="verdict" id="v-' + n + '">' + verdict + '</div>';

    // Let Gemma write a friendlier one-line verdict, if it is running
    if (model) {
      const facts = checks.map(c => (c[0] ? "YES: " : "NO: ") + c[1]).join("; ");
      try {
        const res = await fetch(OLLAMA + "/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            model: model, stream: false,
            messages: [
              {role: "system", content: "You advise first-time open source contributors. Reply with ONE short sentence (max 25 words) saying whether this repository is a good place to start and why. Use only the facts given."},
              {role: "user", content: "Repository: " + repo + ". Score " + score + "/10. Facts: " + facts}
            ]
          })
        });
        if (res.ok) {
          const d = await res.json();
          const t = d.message.content.trim();
          if (t) document.getElementById("v-" + n).textContent = t;
        }
      } catch (e) { /* keep the rule-based verdict */ }
    }
  } catch (e) {
    box.textContent = e.message === "rate"
      ? "GitHub rate limit reached. Wait one minute and try again."
      : "Could not check this repo. Try again in a moment.";
  } finally {
    button.disabled = false;
  }
}

out.addEventListener("click", e => {
  const b = e.target.closest(".explain");
  if (b) explain(Number(b.dataset.n), b);
  const h = e.target.closest(".health");
  if (h) health(Number(h.dataset.n), h);
});
btn.addEventListener("click", findIssues);
document.getElementById("kw").addEventListener("keydown", e => { if (e.key === "Enter") findIssues(); });
detectModel();
</script>
</body>
</html>
